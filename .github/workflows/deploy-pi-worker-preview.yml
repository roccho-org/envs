name: Pi Worker accepted OAuth screen deploy

on:
  workflow_dispatch:
    inputs:
      scope:
        type: choice
        options: [screen, runtime, runtime-diagnostic]
        default: screen
        description: "Screen, finite owner runtime, or read-only runtime diagnostics"

permissions:
  actions: read
  contents: read

concurrency:
  group: pi-worker-oauth-preview
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.repository == 'roccho-org/envs' && github.ref == 'refs/heads/proposals' && github.event_name == 'workflow_dispatch' && github.actor == 'roccho-dev' && github.actor_id == '40359643' && github.triggering_actor == 'roccho-dev' && github.run_attempt == 1 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: dev-projection
    steps:
      - name: Checkout exact envs source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Obtain provided effect artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ENVS_SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          echo "platform: $ImageOS $ImageVersion"
          api="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions"
          auth="Authorization: Bearer $GH_TOKEN"
          art="$(mktemp -d)"
          curl -fsSL -H "$auth" -o "$art/list.json" "$api/artifacts?name=envs-effect-$ENVS_SOURCE_SHA&per_page=100"
          jq -e '[.artifacts[] | select(.expired | not)] | length == 1 and (.[0].digest | test("^sha256:[0-9a-f]{64}$"))' "$art/list.json" >/dev/null
          jq '[.artifacts[] | select(.expired | not)][0]' "$art/list.json" >"$art/artifact.json"
          id="$(jq -r '.id' "$art/artifact.json")"
          digest="$(jq -r '.digest' "$art/artifact.json")"
          run_id="$(jq -r '.workflow_run.id' "$art/artifact.json")"
          curl -fsSL -H "$auth" -o "$art/run.json" "$api/runs/$run_id"
          jq -e --arg sha "$ENVS_SOURCE_SHA" --arg branch "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" --arg repo "$GITHUB_REPOSITORY" --arg current "$GITHUB_RUN_ID" \
            '.path == ".github/workflows/check.yml" and .head_sha == $sha and .head_branch == $branch and .repository.full_name == $repo and .head_repository.full_name == $repo and ((.id | tostring) == $current or (.event == "push" and .conclusion == "success"))' \
            "$art/run.json" >/dev/null
          curl -fsSL -H "$auth" -o "$art/envs-effect.zip" "$api/artifacts/$id/zip"
          echo "${digest#sha256:}  $art/envs-effect.zip" | sha256sum -c -
          unzip -q "$art/envs-effect.zip" -d "$art/content"
          test "$(ls -A "$art/content")" = envs-effect.tar
          test "$(tar -xOf "$art/content/envs-effect.tar" SOURCE)" = "$ENVS_SOURCE_SHA"
          entry="$(tar -xOf "$art/content/envs-effect.tar" ENTRY)"
          [[ "$entry" =~ ^/nix/store/[0-9a-z]{32}-envs-effect-toolchain/bin/envs-effect$ ]]
          sudo mkdir -p /nix/store
          sudo tar -x -C / -f "$art/content/envs-effect.tar" nix/store
          test -x "$entry"
          echo "artifact: run=$run_id id=$id digest=$digest entry=$entry"
          echo "ENVS_EFFECT_BIN=${entry%/envs-effect}" >>"$GITHUB_ENV"
          echo "ENVS_EFFECT_DIGEST=$digest" >>"$GITHUB_ENV"
          echo "ENVS_EFFECT_ZIP=$art/envs-effect.zip" >>"$GITHUB_ENV"

      - name: Resolve the accepted Pi merge and require successful checks
        if: inputs.scope != 'runtime-diagnostic'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "${{ inputs.scope }}" == runtime ]]; then
            gh api repos/roccho-org/ops/pulls/608 > "$RUNNER_TEMP/pi-runtime-pr.json"
            jq -e '.merged == true and .state == "closed" and .base.repo.full_name == "roccho-org/ops" and .base.ref == "proposals" and .head.repo.full_name == "roccho-org/ops" and .head.ref == "codex/pi-jev-worker-20261020" and (.merge_commit_sha | test("^[0-9a-f]{40}$"))' "$RUNNER_TEMP/pi-runtime-pr.json" >/dev/null
            OPS_SHA="$(jq -r .merge_commit_sha "$RUNNER_TEMP/pi-runtime-pr.json")"
            gh api "repos/roccho-org/ops/compare/$OPS_SHA...proposals" > "$RUNNER_TEMP/pi-runtime-canonical.json"
            jq -e --arg sha "$OPS_SHA" '.base_commit.sha == $sha and (.status == "identical" or .status == "ahead")' "$RUNNER_TEMP/pi-runtime-canonical.json" >/dev/null
            gh api "repos/roccho-org/ops/commits/$OPS_SHA/check-runs?per_page=100" > "$RUNNER_TEMP/pi-runtime-checks.json"
            jq -e '[.check_runs[] | select(.name == "proof" or .name == "flake-check" or .name == "jev-review-fresh-consumer")] | (map(.name) | unique | sort) == ["flake-check", "jev-review-fresh-consumer", "proof"] and all(.status == "completed" and .conclusion == "success")' "$RUNNER_TEMP/pi-runtime-checks.json" >/dev/null
            echo "OPS_SHA=$OPS_SHA" >> "$GITHUB_ENV"
            exit 0
          fi
          gh api repos/roccho-org/ops/pulls/563 > "$RUNNER_TEMP/pi-pr.json"
          jq -e '.merged == true and .state == "closed" and .base.repo.full_name == "roccho-org/ops" and .base.ref == "proposals" and .head.repo.full_name == "roccho-org/ops" and .head.ref == "poc/pi-worker-oauth-20261017" and (.merge_commit_sha | test("^[0-9a-f]{40}$"))' "$RUNNER_TEMP/pi-pr.json" >/dev/null
          OPS_SHA="$(jq -r .merge_commit_sha "$RUNNER_TEMP/pi-pr.json")"
          gh api "repos/roccho-org/ops/compare/$OPS_SHA...proposals" > "$RUNNER_TEMP/pi-canonical.json"
          jq -e --arg sha "$OPS_SHA" '.base_commit.sha == $sha and (.status == "identical" or .status == "ahead")' "$RUNNER_TEMP/pi-canonical.json" >/dev/null
          gh api "repos/roccho-org/ops/commits/$OPS_SHA/check-runs?per_page=100" > "$RUNNER_TEMP/pi-checks.json"
          jq -e '[.check_runs[] | select(.name == "proof" or .name == "flake-check" or .name == "jev-review-fresh-consumer")] | (map(.name) | unique | sort) == ["flake-check", "jev-review-fresh-consumer", "proof"] and all(.status == "completed" and .conclusion == "success")' "$RUNNER_TEMP/pi-checks.json" >/dev/null
          echo "OPS_SHA=$OPS_SHA" >> "$GITHUB_ENV"
          echo "Pi source: merged roccho-org/ops#563 source=$OPS_SHA on proposals"

      - name: Obtain the exact CI-built screen-only Worker
        if: inputs.scope == 'screen'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="$GITHUB_API_URL/repos/roccho-org/ops/actions"
          auth="Authorization: Bearer $GH_TOKEN"
          art="$(mktemp -d)"
          curl -fsSL -H "$auth" "$api/artifacts?name=pi-worker-screen-$OPS_SHA&per_page=100" > "$art/list.json"
          jq -e '[.artifacts[] | select(.expired | not)] | length > 0' "$art/list.json" >/dev/null
          jq '[.artifacts[] | select(.expired | not)] | sort_by(.created_at) | last' "$art/list.json" > "$art/artifact.json"
          id="$(jq -r .id "$art/artifact.json")"
          digest="$(jq -r .digest "$art/artifact.json")"
          run="$(jq -r .workflow_run.id "$art/artifact.json")"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          curl -fsSL -H "$auth" "$api/runs/$run" > "$art/run.json"
          jq -e --arg sha "$OPS_SHA" '.head_sha == $sha and .path == ".github/workflows/pi-worker-proof.yml" and .head_branch == "proposals" and .event == "push" and .conclusion == "success" and .repository.full_name == "roccho-org/ops" and .head_repository.full_name == "roccho-org/ops"' "$art/run.json" >/dev/null
          curl -fsSL -H "$auth" -o "$art/screen.zip" "$api/artifacts/$id/zip"
          echo "${digest#sha256:}  $art/screen.zip" | sha256sum -c -
          unzip -q "$art/screen.zip" -d "$art/screen"
          jq -e --arg sha "$OPS_SHA" '.schema == "pi-worker-screen-source.v1" and .ops_sha == $sha and .upstream_sha == "dcb56ce2d174babb3f00112ac5b8cd597e58ab45" and .scope == "SCREEN_ONLY_NO_TOKEN_EXCHANGE_OR_STORAGE"' "$art/screen/source.json" >/dev/null
          jq -e '.main == "screen-entry.js" and .no_bundle == true and .preview_urls == false and .observability.enabled == false and (has("durable_objects") or has("assets") or has("services") or has("vars") or has("routes") | not)' "$art/screen/wrangler.json" >/dev/null
          echo "PI_SCREEN_DIR=$art/screen" >> "$GITHUB_ENV"
          echo "Pi screen artifact: run=$run id=$id digest=$digest source=$OPS_SHA"

      - name: Obtain separately admitted owner runtime from successful canonical CI
        if: inputs.scope == 'runtime'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="$GITHUB_API_URL/repos/roccho-org/ops/actions"
          art="$(mktemp -d)"
          gh api "repos/roccho-org/ops/actions/artifacts?name=pi-jev-runtime-$OPS_SHA&per_page=100" > "$art/list.json"
          jq '[.artifacts[] | select(.expired | not)] | sort_by(.created_at) | last' "$art/list.json" > "$art/artifact.json"
          id="$(jq -er .id "$art/artifact.json")"
          digest="$(jq -er '.digest | select(test("^sha256:[0-9a-f]{64}$"))' "$art/artifact.json")"
          run="$(jq -er .workflow_run.id "$art/artifact.json")"
          gh api "repos/roccho-org/ops/actions/runs/$run" > "$art/run.json"
          jq -e --arg sha "$OPS_SHA" '.head_sha == $sha and .path == ".github/workflows/pi-worker-proof.yml" and .head_branch == "proposals" and .event == "push" and .conclusion == "success" and .repository.full_name == "roccho-org/ops" and .head_repository.full_name == "roccho-org/ops"' "$art/run.json" >/dev/null
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -o "$art/runtime.zip" "$api/artifacts/$id/zip"
          echo "${digest#sha256:}  $art/runtime.zip" | sha256sum -c -
          unzip -q "$art/runtime.zip" -d "$art/runtime"
          (cd "$art/runtime" && sha256sum -c SHA256SUMS)
          jq -e --arg sha "$OPS_SHA" '.schema == "pi-jev-runtime-source.v1" and .ops_sha == $sha and .upstream_sha == "dcb56ce2d174babb3f00112ac5b8cd597e58ab45" and .scope == "KEYLESS_SELECTED_OWNER_TRANSIENT_RUNTIME" and .deployment == "NOT_RUN"' "$art/runtime/source.json" >/dev/null
          jq -e '.main == "runtime-entry.js" and .no_bundle == true and .workers_dev == true and .preview_urls == false and .observability.enabled == false and .durable_objects.bindings == [{"name":"SESSIONS","class_name":"Session"}] and .migrations == [{"tag":"pi-jev-proof-v1","new_sqlite_classes":["Session"]}] and (has("vars") or has("assets") or has("services") | not)' "$art/runtime/wrangler.json" >/dev/null
          echo "PI_RUNTIME_DIR=$art/runtime" >> "$GITHUB_ENV"
          echo "Runtime source=$OPS_SHA producer=$run artifact=$id digest=$digest"
          "$ENVS_EFFECT_BIN/wrangler" deploy --config "$art/runtime/wrangler.json" --name pi --no-bundle --dry-run

      - name: Native Wrangler dry-run before mapping Cloudflare credentials
        if: inputs.scope == 'screen'
        run: '"$ENVS_EFFECT_BIN/wrangler" versions upload --config "$PI_SCREEN_DIR/wrangler.json" --name pi --no-bundle --dry-run'

      - name: Deploy only the screen preview using existing native auth
        if: inputs.scope == 'screen'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PI_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: |
          set -euo pipefail
          umask 077
          report_api_error() {
            "$ENVS_EFFECT_BIN/python3" -I -c '
          import json, re, sys
          from pathlib import Path
          raw = ""
          for filename in sys.argv[2:]:
              try:
                  raw += Path(filename).read_text(errors="replace") + "\n"
              except OSError:
                  pass
          raw = re.sub(r"\x1b\[[0-?]*[ -/]*[@-~]", "", raw)
          paths = sorted(set(re.findall(r"A request to the Cloudflare API \((/accounts/[0-9a-f]{32}/workers/[A-Za-z0-9_/-]+|/memberships)\) failed\.", raw)))
          codes = sorted(set(int(code) for code in re.findall(r"\[code: ([0-9]{1,10})\]", raw)))
          if paths or codes:
              print(json.dumps({"phase": sys.argv[1], "api_paths": paths, "codes": codes}, separators=(",", ":")))
          ' "$@" 2> "$RUNNER_TEMP/pi-api-diagnostic.stderr" || echo "pi diagnostic exit=$?"
          }
          operation_exit=0
          version_id=""
          "$ENVS_EFFECT_BIN/wrangler" deployments status --name pi --json > "$RUNNER_TEMP/pi-deployment-before.json" 2> "$RUNNER_TEMP/pi-status-before.stderr" || operation_exit=$?
          echo "pi status-before exit=$operation_exit"
          if [[ "$operation_exit" != 0 ]]; then
            report_api_error status-before "$RUNNER_TEMP/pi-deployment-before.json" "$RUNNER_TEMP/pi-status-before.stderr"
          fi
          if [[ "$operation_exit" == 0 ]]; then
            jq -ce '{id, versions: [.versions[] | {version_id, percentage}]}' "$RUNNER_TEMP/pi-deployment-before.json" 2> "$RUNNER_TEMP/pi-status-before-jq.stderr" || operation_exit=$?
            echo "pi status-before-projection exit=$operation_exit"
          fi
          if [[ "$operation_exit" == 0 ]]; then
            # One deterministic UUID for this exact account/Worker host, stable across deployments.
            host_id="$("$ENVS_EFFECT_BIN/python3" -I -c 'import os,uuid; print(uuid.uuid5(uuid.NAMESPACE_URL,"urn:cloudflare:workers:"+os.environ["CLOUDFLARE_ACCOUNT_ID"]+":pi"))' 2> "$RUNNER_TEMP/pi-host-id.stderr")" || operation_exit=$?
            echo "pi host-id exit=$operation_exit"
          fi
          if [[ "$operation_exit" == 0 ]]; then
            upload_output="$(mktemp "$RUNNER_TEMP/pi-version-upload.XXXXXX.jsonl")" || operation_exit=$?
            echo "pi upload-output-file exit=$operation_exit"
          fi
          if [[ "$operation_exit" == 0 ]]; then
            WRANGLER_OUTPUT_FILE_PATH="$upload_output" "$ENVS_EFFECT_BIN/wrangler" versions upload --config "$PI_SCREEN_DIR/wrangler.json" --name pi --var "PI_OAUTH_HOST_ID:$host_id" --no-bundle > "$RUNNER_TEMP/pi-upload.stdout" 2> "$RUNNER_TEMP/pi-upload.stderr" || operation_exit=$?
            echo "pi upload exit=$operation_exit"
            if [[ "$operation_exit" != 0 ]]; then
              report_api_error upload "$RUNNER_TEMP/pi-upload.stdout" "$RUNNER_TEMP/pi-upload.stderr"
            fi
          fi
          if [[ "$operation_exit" == 0 ]]; then
            version_id="$(jq -ser '[.[] | select(.type == "version-upload")] | select(length == 1) | .[0] | select(.version == 1 and .worker_name == "pi" and .worker_name_overridden == false) | .version_id | select(type == "string" and test("^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"))' "$upload_output" 2> "$RUNNER_TEMP/pi-upload-output.stderr")" || operation_exit=$?
            echo "pi upload-output exit=$operation_exit"
          fi
          if [[ "$operation_exit" == 0 ]]; then
            printf '{"version_id":"%s"}\n' "$version_id"
            "$ENVS_EFFECT_BIN/wrangler" versions deploy "$version_id@100%" --yes --config "$PI_SCREEN_DIR/wrangler.json" --name pi > "$RUNNER_TEMP/pi-deploy.stdout" 2> "$RUNNER_TEMP/pi-deploy.stderr" || operation_exit=$?
            echo "pi deploy exit=$operation_exit"
            if [[ "$operation_exit" != 0 ]]; then
              report_api_error deploy "$RUNNER_TEMP/pi-deploy.stdout" "$RUNNER_TEMP/pi-deploy.stderr"
            fi
          fi
          readback_exit=0
          "$ENVS_EFFECT_BIN/wrangler" deployments status --name pi --json > "$RUNNER_TEMP/pi-deployment-after.json" 2> "$RUNNER_TEMP/pi-status-after.stderr" || readback_exit=$?
          echo "pi status-after exit=$readback_exit"
          if [[ "$readback_exit" != 0 ]]; then
            report_api_error status-after "$RUNNER_TEMP/pi-deployment-after.json" "$RUNNER_TEMP/pi-status-after.stderr"
          fi
          if [[ "$readback_exit" == 0 ]]; then
            jq -ce '{id, versions: [.versions[] | {version_id, percentage}]}' "$RUNNER_TEMP/pi-deployment-after.json" 2> "$RUNNER_TEMP/pi-status-after-jq.stderr" || readback_exit=$?
            echo "pi status-after-projection exit=$readback_exit"
          fi
          if [[ "$operation_exit" == 0 && "$readback_exit" == 0 ]]; then
            jq -e --arg version_id "$version_id" '(.versions | length) == 1 and .versions[0].version_id == $version_id and .versions[0].percentage == 100' "$RUNNER_TEMP/pi-deployment-after.json" > "$RUNNER_TEMP/pi-status-after-match.stdout" 2> "$RUNNER_TEMP/pi-status-after-match.stderr" || readback_exit=$?
            echo "pi status-after-match exit=$readback_exit"
          fi
          if [[ "$operation_exit" != 0 ]]; then
            exit "$operation_exit"
          fi
          exit "$readback_exit"
      - name: Read-only runtime API capability diagnostics
        if: inputs.scope == 'runtime-diagnostic'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PI_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers"
          diagnostic_exit=0
          for endpoint in services/pi scripts; do
            body="$(mktemp "$RUNNER_TEMP/pi-capability.XXXXXX.json")"
            if ! http="$(curl --silent --show-error --max-time 20 --request GET --output "$body" --write-out '%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api/$endpoint" 2> "$body.stderr")"; then
              http=000
            fi
            if ! "$ENVS_EFFECT_BIN/python3" -I - "$endpoint" "$http" "$body" <<'PY'
          import json, re, sys
          from pathlib import Path
          endpoint, http, filename = sys.argv[1:]
          try:
              value = json.loads(Path(filename).read_text())
          except (ValueError, OSError):
              value = None
          valid = isinstance(value, dict) and isinstance(value.get("success"), bool)
          if valid and value["success"]:
              result = value.get("result")
              valid = isinstance(result, dict) if endpoint == "services/pi" else (isinstance(result, list) and all(isinstance(item, dict) and isinstance(item.get("id"), str) for item in result))
          success = value.get("success") if valid else None
          codes = sorted({error["code"] for error in value.get("errors", [])
                          if isinstance(error, dict) and type(error.get("code")) is int}) if valid and isinstance(value.get("errors", []), list) else []
          present = None
          if valid and success and endpoint == "scripts" and isinstance(value.get("result"), list):
              present = any(isinstance(item, dict) and item.get("id") == "pi" for item in value["result"])
          print(json.dumps({"scope":"READ_ONLY_OBSERVATION_NOT_DEPLOYMENT",
                            "endpoint":endpoint, "http":http if re.fullmatch(r"[0-9]{3}", http) else "UNKNOWN",
                            "success":success, "codes":codes, "target_pi_present":present}, separators=(",", ":")))
          sys.exit(0 if success is True and http == "200" else 1)
          PY
            then
              diagnostic_exit=1
            fi
          done
          exit "$diagnostic_exit"

      - name: Apply finite owner runtime migration and existing Jev binding
        if: inputs.scope == 'runtime'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PI_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          JEV_API_KEY: ${{ secrets.JEV_API_KEY }}
          WRANGLER_SEND_METRICS: 'false'
        run: |
          set -euo pipefail
          umask 077
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$JEV_API_KEY"
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers"
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api/scripts/pi/settings" > "$RUNNER_TEMP/pi-runtime-before.json"
          jq -e '.success == true and all(.result.bindings[]; .name != "PI_CHATGPT_BOOTSTRAP" and (.type != "secret_text" or .name == "PI_JEV_PROOF_API_KEY"))' "$RUNNER_TEMP/pi-runtime-before.json" >/dev/null
          "$ENVS_EFFECT_BIN/wrangler" deployments status --name pi --json > "$RUNNER_TEMP/pi-runtime-prior-deployment.json" 2> "$RUNNER_TEMP/pi-runtime-prior-status.stderr"
          prior="$(jq -er '.versions | select(length == 1 and .[0].percentage == 100) | .[0].version_id' "$RUNNER_TEMP/pi-runtime-prior-deployment.json")"
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api/scripts/pi/versions/$prior" > "$RUNNER_TEMP/pi-runtime-history.json"
          # Wrangler4.93 treats omitted optional tag as initial migration; no claim of complete history absence.
          jq -e --arg prior "$prior" '.success == true and .result.id == $prior and (.result.resources.script_runtime | type == "object") and (.result.resources.script_runtime | (has("migration_tag") | not) or (.migration_tag | type == "string" and (. == "" or . == "pi-jev-proof-v1")))' "$RUNNER_TEMP/pi-runtime-history.json" >/dev/null
          # Wrangler reads this latest script tag; it is distinct from the current deployed version above.
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api/scripts" > "$RUNNER_TEMP/pi-runtime-latest.json"
          jq -e '.success == true and (.result | type == "array") and ([.result[] | select(.id == "pi")] | length == 1) and ([.result[] | select(.id == "pi")][0] | (has("migration_tag") | not) or (.migration_tag | type == "string" and (. == "" or . == "pi-jev-proof-v1")))' "$RUNNER_TEMP/pi-runtime-latest.json" >/dev/null
          # Unknown prior migration history stops before writes; never delete data or widen credentials.
          "$ENVS_EFFECT_BIN/python3" -I - "$PI_RUNTIME_DIR/wrangler.json" <<'PY'
          import json, pathlib, sys
          path = pathlib.Path(sys.argv[1])
          config = json.loads(path.read_text())
          config["vars"] = {
              "PI_PROOF_TRANSIENT": "true",
              "PI_JEV_PROOF_SESSION": "owner-jev-proof-20261020",
              "PI_ACCESS_ISSUER": "https://roccho.cloudflareaccess.com",
              "PI_ACCESS_AUDIENCE": "3a4db113aeffcad6dcfc27afc21abc1a1c30a4cf1ea2584e4cda7b4edd8319bf",
              "PI_ACCESS_OWNER_HASH": "7c51a47a695796b59dd322db878b455cdc725790797a2c388a348a78bd5527b2",
          }
          path.write_text(json.dumps(config, indent=2) + "\n")
          PY
          report_api_error() {
            "$ENVS_EFFECT_BIN/python3" -I -c '
          import json, re, sys
          from pathlib import Path
          raw = ""
          for filename in sys.argv[2:]:
              try:
                  raw += Path(filename).read_text(errors="replace") + "\n"
              except OSError:
                  pass
          raw = re.sub(r"\x1b\[[0-?]*[ -/]*[@-~]", "", raw)
          paths = sorted(set(re.findall(r"A request to the Cloudflare API \((/accounts/[0-9a-f]{32}/workers/[A-Za-z0-9_/-]+|/memberships)\) failed\.", raw)))
          codes = sorted(set(int(code) for code in re.findall(r"\[code: ([0-9]{1,10})\]", raw)))
          if paths or codes:
              print(json.dumps({"phase": sys.argv[1], "api_paths": paths, "codes": codes}, separators=(",", ":")))
          ' "$@" 2> "$RUNNER_TEMP/pi-api-diagnostic.stderr" || echo "pi diagnostic exit=$?"
          }
          failed_write_readback() {
            local pi_phase="$1"
            report_api_error "$pi_phase" "$RUNNER_TEMP/pi-runtime-$pi_phase.stdout" "$RUNNER_TEMP/pi-runtime-$pi_phase.stderr"
            "$ENVS_EFFECT_BIN/wrangler" deployments status --name pi --json > "$RUNNER_TEMP/pi-runtime-failed-status.json" 2> "$RUNNER_TEMP/pi-runtime-failed-status.stderr" || true
            if observed="$(jq -er '.versions | select(length == 1 and .[0].percentage == 100) | .[0].version_id | select(test("^[0-9a-f-]{36}$"))' "$RUNNER_TEMP/pi-runtime-failed-status.json" 2>/dev/null)"; then
              curl -sS --max-time 20 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api/scripts/pi/versions/$observed" > "$RUNNER_TEMP/pi-runtime-failed-version.json" 2> "$RUNNER_TEMP/pi-runtime-failed-version.stderr" || true
            fi
            curl -sS --max-time 20 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api/scripts" > "$RUNNER_TEMP/pi-runtime-failed-latest.json" 2> "$RUNNER_TEMP/pi-runtime-failed-latest.stderr" || true
            "$ENVS_EFFECT_BIN/python3" -I - "$RUNNER_TEMP" <<'PY'
          import json, re, sys
          from pathlib import Path
          root = Path(sys.argv[1])
          def read(name):
              try:
                  return json.loads((root / name).read_text())
              except (ValueError, OSError):
                  return {}
          def tag(value):
              if not isinstance(value, dict):
                  return "UNKNOWN"
              if "migration_tag" not in value:
                  return "ABSENT"
              return {"":"EMPTY", "pi-jev-proof-v1":"pi-jev-proof-v1"}.get(value["migration_tag"], "UNKNOWN") if isinstance(value["migration_tag"], str) else "UNKNOWN"
          status = read("pi-runtime-failed-status.json")
          versions = status.get("versions") if isinstance(status, dict) else None
          current = versions[0].get("version_id") if isinstance(versions, list) and len(versions) == 1 and isinstance(versions[0], dict) and versions[0].get("percentage") == 100 else None
          current = current if isinstance(current, str) and re.fullmatch(r"[0-9a-f-]{36}", current) else "UNKNOWN"
          value = read("pi-runtime-failed-version.json")
          result = value.get("result") if isinstance(value, dict) and value.get("success") is True else None
          runtime = result.get("resources", {}).get("script_runtime") if isinstance(result, dict) and result.get("id") == current and isinstance(result.get("resources"), dict) else None
          value = read("pi-runtime-failed-latest.json")
          rows = value.get("result") if isinstance(value, dict) and value.get("success") is True else None
          rows = [row for row in rows if isinstance(row, dict) and row.get("id") == "pi"] if isinstance(rows, list) else []
          print(json.dumps({"scope":"FAILED_WRITE_CURRENT_AND_LATEST_OBSERVATIONS_ONLY",
                            "current_version":current, "current_migration_tag":tag(runtime),
                            "latest_pi_migration_tag":tag(rows[0]) if len(rows) == 1 else "UNKNOWN"}, separators=(",", ":")))
          PY
          }
          # deploy applies the admitted SQLite migration; versions upload is insufficient here.
          deploy_output="$(mktemp "$RUNNER_TEMP/pi-runtime-deploy.XXXXXX.jsonl")"
          if ! WRANGLER_OUTPUT_FILE_PATH="$deploy_output" "$ENVS_EFFECT_BIN/wrangler" deploy --config "$PI_RUNTIME_DIR/wrangler.json" --name pi --no-bundle > "$RUNNER_TEMP/pi-runtime-deploy.stdout" 2> "$RUNNER_TEMP/pi-runtime-deploy.stderr"; then
            failed_write_readback deploy
            echo "Runtime deploy failed; no credential fallback or automatic retry"; exit 1
          fi
          deployed="$(jq -ser '[.[] | select(.type == "deploy" and .version == 1 and .worker_name == "pi" and .worker_name_overridden == false)] | select(length == 1) | .[0].version_id | select(test("^[0-9a-f-]{36}$"))' "$deploy_output")"
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api/scripts/pi/versions/$deployed" > "$RUNNER_TEMP/pi-runtime-code.json"
          etag="$(jq -er --arg deployed "$deployed" 'select(.success == true and .result.id == $deployed) | .result.resources.script.etag | select(type == "string" and length > 0)' "$RUNNER_TEMP/pi-runtime-code.json")"
          # Only the existing Jev key is persistent. Never bind ChatGPT credentials.
          if ! printf %s "$JEV_API_KEY" | "$ENVS_EFFECT_BIN/wrangler" secret put PI_JEV_PROOF_API_KEY --config "$PI_RUNTIME_DIR/wrangler.json" --name pi > "$RUNNER_TEMP/pi-runtime-key.stdout" 2> "$RUNNER_TEMP/pi-runtime-key.stderr"; then
            failed_write_readback key
            echo "Jev binding failed; runtime remains unproved; no automatic retry"; exit 1
          fi
          # secret put can create another version: read the CURRENT deployment only after it.
          "$ENVS_EFFECT_BIN/wrangler" deployments status --name pi --json > "$RUNNER_TEMP/pi-runtime-deployment.json" 2> "$RUNNER_TEMP/pi-runtime-status.stderr"
          jq -e '(.versions | length) == 1 and .versions[0].percentage == 100' "$RUNNER_TEMP/pi-runtime-deployment.json" >/dev/null
          version="$(jq -r .versions[0].version_id "$RUNNER_TEMP/pi-runtime-deployment.json")"
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api/scripts/pi/settings" > "$RUNNER_TEMP/pi-runtime-settings.json"
          jq -e '.success == true and any(.result.bindings[]; .name == "SESSIONS" and .type == "durable_object_namespace" and .class_name == "Session") and any(.result.bindings[]; .name == "PI_JEV_PROOF_API_KEY" and .type == "secret_text") and all(.result.bindings[]; .name != "PI_CHATGPT_BOOTSTRAP") and .result.observability.enabled == false' "$RUNNER_TEMP/pi-runtime-settings.json" >/dev/null
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api/scripts/pi/versions/$version" > "$RUNNER_TEMP/pi-runtime-version.json"
          jq -e --arg etag "$etag" --arg version "$version" '.success == true and .result.id == $version and .result.resources.script.etag == $etag and .result.resources.script_runtime.migration_tag == "pi-jev-proof-v1"' "$RUNNER_TEMP/pi-runtime-version.json" >/dev/null
          jq -e '(.result.bindings | map(select(.type == "plain_text")) | map({key:.name,value:.text}) | from_entries) as $vars | $vars.PI_PROOF_TRANSIENT == "true" and $vars.PI_JEV_PROOF_SESSION == "owner-jev-proof-20261020" and $vars.PI_ACCESS_ISSUER == "https://roccho.cloudflareaccess.com" and $vars.PI_ACCESS_AUDIENCE == "3a4db113aeffcad6dcfc27afc21abc1a1c30a4cf1ea2584e4cda7b4edd8319bf" and $vars.PI_ACCESS_OWNER_HASH == "7c51a47a695796b59dd322db878b455cdc725790797a2c388a348a78bd5527b2"' "$RUNNER_TEMP/pi-runtime-settings.json" >/dev/null
          "$ENVS_EFFECT_BIN/wrangler" deployments status --name pi --json > "$RUNNER_TEMP/pi-runtime-confirmation.json" 2> "$RUNNER_TEMP/pi-runtime-confirmation.stderr"
          jq -e --arg version "$version" '(.versions | length) == 1 and .versions[0].percentage == 100 and .versions[0].version_id == $version' "$RUNNER_TEMP/pi-runtime-confirmation.json" >/dev/null
          # A bounded consistent snapshot, not a guarantee against every future writer.
          jq -c --arg version "$version" --arg deployed "$deployed" --arg etag "$etag" --arg source "$OPS_SHA" '{scope:"DEPLOYMENT_ONLY_NOT_INFERENCE",ops_sha:$source,version:$version,deployed_version:$deployed,code_etag:$etag,migration_tag:"pi-jev-proof-v1",bindings:[.result.bindings[] | {name,type,class_name,namespace_id}],observability:.result.observability}' "$RUNNER_TEMP/pi-runtime-settings.json"
