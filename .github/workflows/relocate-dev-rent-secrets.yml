name: relocate-dev-rent-secrets

# Temporary one-time encrypted relocation of the four existing rent Secrets from dev-rent-tunnel to dev-projection.
# The run only seals them to the fixed existing dev-projection public key; the owner registers the ciphertext.
# Retired after its single authorized run, before dev-rent-tunnel is deleted.
on:
  workflow_dispatch:
    inputs:
      expected_source_sha:
        description: Exact canonical source SHA authorized for this one run
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: relocate-dev-rent-secrets
  cancel-in-progress: false

jobs:
  relocate:
    # Exact repository, branch ref (never a tag), event, source, first attempt and controller before the Environment.
    if: ${{ github.repository == 'roccho-org/envs' && github.repository_id == '1391871347' && github.ref == 'refs/heads/proposals' && github.event_name == 'workflow_dispatch' && github.sha == inputs.expected_source_sha && github.run_attempt == '1' && github.actor == 'roccho-dev' && github.actor_id == '40359643' && github.triggering_actor == 'roccho-dev' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # The old Environment's job is one trusted boundary: only the seal step maps Secrets, which is not job isolation.
    environment: dev-rent-tunnel
    steps:
      - name: Checkout exact canonical revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install pinned Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
        with:
          extra_nix_config: |
            extra-experimental-features = nix-command flakes

      # No Secret is mapped while tools are built: the locked nixpkgs Python with PyNaCl, nothing else.
      - name: Build locked Python with PyNaCl
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          flake="builtins.getFlake \"path:$GITHUB_WORKSPACE\""
          test "$(nix eval --impure --raw --expr "($flake).inputs.nixpkgs.rev")" = f9948418dc8628ac02b6d6337e191ade9429d59d
          pkgs="import ($flake).inputs.nixpkgs { system = \"x86_64-linux\"; }"
          python="$(nix build --impure --no-link --print-out-paths --expr "($pkgs).python3.withPackages (ps: [ ps.pynacl ])")/bin/python3"
          echo "RELOCATE_PYTHON=$python" >>"$GITHUB_ENV"

      - name: Synthetic self-test before any Secret
        run: '"$RELOCATE_PYTHON" -I adapters/relocate_rent_secrets.py selftest'

      - name: Seal the four Secrets to the dev-projection public key
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          RENT_STATE_PASSPHRASE: ${{ secrets.RENT_STATE_PASSPHRASE }}
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
        run: '"$RELOCATE_PYTHON" -I adapters/relocate_rent_secrets.py seal --output "$RUNNER_TEMP/relocate/receipt.json"'

      - name: Upload the encrypted receipt only
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: relocate-receipt-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/relocate/receipt.json
          if-no-files-found: error
          retention-days: 3
