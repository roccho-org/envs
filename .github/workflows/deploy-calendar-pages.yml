name: family calendar Pages deploy

on:
  issue_comment:
    types: [created]

permissions:
  actions: read
  contents: read

concurrency:
  group: family-calendar-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event.repository.owner.type == 'Organization' &&
      github.repository == 'roccho-org/envs' &&
      github.event.issue.number == 69 &&
      github.event.issue.pull_request == null &&
      github.event.comment.user.id == 40359643 &&
      github.actor == 'roccho-dev' &&
      github.actor_id == '40359643' &&
      github.triggering_actor == 'roccho-dev' &&
      github.ref_name == 'proposals' &&
      github.run_attempt == 1 &&
      startsWith(github.event.comment.body, '/deploy-calendar ')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: dev-projection
    steps:
      - name: Checkout exact envs canonical revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      # Consumes the artifact that check provided for this exact SHA; nothing is built or installed here.
      - name: Obtain provided effect artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ENVS_SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          echo "platform: $ImageOS $ImageVersion"
          api="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions"
          auth="Authorization: Bearer $GH_TOKEN"
          art="$(mktemp -d)"
          curl -fsSL -H "$auth" -o "$art/list.json" "$api/artifacts?name=envs-effect-$ENVS_SOURCE_SHA&per_page=100"
          jq -e '[.artifacts[] | select(.expired | not)] | length == 1 and (.[0].digest | test("^sha256:[0-9a-f]{64}$"))' "$art/list.json" >/dev/null
          jq '[.artifacts[] | select(.expired | not)][0]' "$art/list.json" >"$art/artifact.json"
          id="$(jq -r '.id' "$art/artifact.json")"
          digest="$(jq -r '.digest' "$art/artifact.json")"
          run_id="$(jq -r '.workflow_run.id' "$art/artifact.json")"
          curl -fsSL -H "$auth" -o "$art/run.json" "$api/runs/$run_id"
          jq -e --arg sha "$ENVS_SOURCE_SHA" --arg branch "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" --arg repo "$GITHUB_REPOSITORY" --arg current "$GITHUB_RUN_ID" \
            '.path == ".github/workflows/check.yml" and .head_sha == $sha and .head_branch == $branch and .repository.full_name == $repo and .head_repository.full_name == $repo and ((.id | tostring) == $current or (.event == "push" and .conclusion == "success"))' \
            "$art/run.json" >/dev/null
          curl -fsSL -H "$auth" -o "$art/envs-effect.zip" "$api/artifacts/$id/zip"
          echo "${digest#sha256:}  $art/envs-effect.zip" | sha256sum -c -
          unzip -q "$art/envs-effect.zip" -d "$art/content"
          test "$(ls -A "$art/content")" = envs-effect.tar
          test "$(tar -xOf "$art/content/envs-effect.tar" SOURCE)" = "$ENVS_SOURCE_SHA"
          entry="$(tar -xOf "$art/content/envs-effect.tar" ENTRY)"
          [[ "$entry" =~ ^/nix/store/[0-9a-z]{32}-envs-effect-toolchain/bin/envs-effect$ ]]
          sudo mkdir -p /nix/store
          sudo tar -x -C / -f "$art/content/envs-effect.tar" nix/store
          test -x "$entry"
          echo "artifact: run=$run_id id=$id digest=$digest entry=$entry"
          echo "ENVS_EFFECT_BIN=${entry%/envs-effect}" >>"$GITHUB_ENV"
          echo "ENVS_EFFECT_DIGEST=$digest" >>"$GITHUB_ENV"
          echo "ENVS_EFFECT_ZIP=$art/envs-effect.zip" >>"$GITHUB_ENV"

      - name: Record effect toolchain identity
        run: '"$ENVS_EFFECT_BIN/envs-effect" --root "$GITHUB_WORKSPACE" toolchain'

      - name: Validate the owner request without secrets
        id: select
        run: '"$ENVS_EFFECT_BIN/python3" -I adapters/calendar_pages.py select'

      - name: Checkout exact publicly readable apps source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: roccho-dev/apps
          ref: ${{ steps.select.outputs.app_sha }}
          path: calendar-source
          persist-credentials: false

      - name: Prove source and apps CI success without Cloudflare credentials
        env:
          APP_SHA: ${{ steps.select.outputs.app_sha }}
          GH_TOKEN: ${{ github.token }}
          SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
        run: '"$ENVS_EFFECT_BIN/python3" -I adapters/calendar_pages.py verify'

      # One Cloudflare effect step: the existing Environment's token and
      # account locator are never copied to apps, a shell argument, or a log.
      - name: Direct Upload and provider + public byte readback
        env:
          APP_SHA: ${{ steps.select.outputs.app_sha }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
        run: '"$ENVS_EFFECT_BIN/python3" -I adapters/calendar_pages.py deploy'
