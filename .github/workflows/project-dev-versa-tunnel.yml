name: project-dev-versa-tunnel

on:
  workflow_dispatch:
    inputs:
      expected_source_sha:
        description: Exact accepted canonical source SHA for the one apply run
        type: string
        required: true

permissions:
  actions: read
  contents: write
  pull-requests: write

concurrency:
  group: project-dev-versa-tunnel
  cancel-in-progress: false

jobs:
  project:
    # One dispatch by the declared native caller on the accepted canonical SHA, gated before the Environment.
    # contents: write lets the entry create and update the state ref and its lock ref, and the last step push the
    # handoff branch; the state there is OpenTofu-encrypted before it leaves the runner.
    if: ${{ github.repository == 'roccho-org/envs' && github.repository_id == '1391871347' && github.ref == 'refs/heads/proposals' && github.event_name == 'workflow_dispatch' && github.sha == inputs.expected_source_sha && github.run_attempt == '1' && github.actor == 'roccho-dev' && github.actor_id == '40359643' && github.triggering_actor == 'roccho-dev' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: dev-projection
    steps:
      - name: Checkout exact canonical revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      # Consumes the artifact that check provided for this exact SHA; nothing is built or installed here.
      - name: Obtain provided effect artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ENVS_SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          echo "platform: $ImageOS $ImageVersion"
          api="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions"
          auth="Authorization: Bearer $GH_TOKEN"
          art="$(mktemp -d)"
          curl -fsSL -H "$auth" -o "$art/list.json" "$api/artifacts?name=envs-effect-$ENVS_SOURCE_SHA&per_page=100"
          jq -e '[.artifacts[] | select(.expired | not)] | length == 1 and (.[0].digest | test("^sha256:[0-9a-f]{64}$"))' "$art/list.json" >/dev/null
          jq '[.artifacts[] | select(.expired | not)][0]' "$art/list.json" >"$art/artifact.json"
          id="$(jq -r '.id' "$art/artifact.json")"
          digest="$(jq -r '.digest' "$art/artifact.json")"
          run_id="$(jq -r '.workflow_run.id' "$art/artifact.json")"
          curl -fsSL -H "$auth" -o "$art/run.json" "$api/runs/$run_id"
          jq -e --arg sha "$ENVS_SOURCE_SHA" --arg branch "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" --arg repo "$GITHUB_REPOSITORY" --arg current "$GITHUB_RUN_ID" \
            '.path == ".github/workflows/check.yml" and .head_sha == $sha and .head_branch == $branch and .repository.full_name == $repo and .head_repository.full_name == $repo and ((.id | tostring) == $current or (.event == "push" and .conclusion == "success"))' \
            "$art/run.json" >/dev/null
          curl -fsSL -H "$auth" -o "$art/envs-effect.zip" "$api/artifacts/$id/zip"
          echo "${digest#sha256:}  $art/envs-effect.zip" | sha256sum -c -
          unzip -q "$art/envs-effect.zip" -d "$art/content"
          test "$(ls -A "$art/content")" = envs-effect.tar
          test "$(tar -xOf "$art/content/envs-effect.tar" SOURCE)" = "$ENVS_SOURCE_SHA"
          entry="$(tar -xOf "$art/content/envs-effect.tar" ENTRY)"
          [[ "$entry" =~ ^/nix/store/[0-9a-z]{32}-envs-effect-toolchain/bin/envs-effect$ ]]
          sudo mkdir -p /nix/store
          sudo tar -x -C / -f "$art/content/envs-effect.tar" nix/store
          test -x "$entry"
          echo "artifact: run=$run_id id=$id digest=$digest entry=$entry"
          echo "ENVS_EFFECT_BIN=${entry%/envs-effect}" >>"$GITHUB_ENV"
          echo "ENVS_EFFECT_DIGEST=$digest" >>"$GITHUB_ENV"
          echo "ENVS_EFFECT_ZIP=$art/envs-effect.zip" >>"$GITHUB_ENV"

      - name: Record effect toolchain identity
        run: '"$ENVS_EFFECT_BIN/envs-effect" --root "$GITHUB_WORKSPACE" toolchain'

      # Standard OpenTofu applies the versa root on its encrypted, locked GitHub-ref state; its sensitive credentials
      # output stays in memory and is sealed to the one handoff recipient. Only the loopback state child gets the
      # workflow token; a failure prints a closed kind and stage only.
      - name: Apply the versa root and seal its envelope
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VERSA_CLOUDFLARE_API_TOKEN: ${{ secrets.VERSA_CLOUDFLARE_API_TOKEN }}
          VERSA_STATE_PASSPHRASE: ${{ secrets.VERSA_STATE_PASSPHRASE }}
          VERSA_ACCESS_EMAILS: ${{ secrets.VERSA_ACCESS_EMAILS }}
          VERSA_CLOUDFLARE_ACCOUNT_ID: ${{ vars.VERSA_CLOUDFLARE_ACCOUNT_ID }}
          VERSA_CLOUDFLARE_ZONE_ID: ${{ vars.VERSA_CLOUDFLARE_ZONE_ID }}
          VERSA_SERVICE_TOKEN_DURATION: ${{ vars.VERSA_SERVICE_TOKEN_DURATION }}
          VERSA_HANDOFF_AGE_RECIPIENT: ${{ vars.VERSA_HANDOFF_AGE_RECIPIENT }}
        run: '"$ENVS_EFFECT_BIN/envs-effect" --root "$GITHUB_WORKSPACE" versa-root'

      - name: Verify candidate tree
        run: '"$ENVS_EFFECT_BIN/python3" -I checks/repository.py'

      - name: Open ciphertext handoff PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tool="$ENVS_EFFECT_BIN"
          branch="handoff/dev-versa-cloudflare-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          "$tool/git" switch -c "$branch"
          "$tool/git" add ciphertexts/dev-versa-cloudflare.sops.yaml contracts/environments.jsonl
          "$tool/git" diff --cached --check
          "$tool/git" config user.name "roccho"
          "$tool/git" config user.email "40359643+roccho-dev@users.noreply.github.com"
          "$tool/git" commit -m "chore: hand off the dev versa Cloudflare ciphertext"
          "$tool/git" push origin "HEAD:refs/heads/$branch"
          "$tool/gh" pr create \
            --base proposals \
            --head "$branch" \
            --title "chore: hand off the dev versa Cloudflare ciphertext" \
            --body "Generated by the manual dev versa root. Contains the versa tunnel token and the muse Access service token, sealed for one handoff age recipient, with no plaintext value, API token, state key, email or private age identity. The commit names the repository owner, the pushing actor is the workflow token and the commit is unsigned. Placement on versa and muse is not proven here."
